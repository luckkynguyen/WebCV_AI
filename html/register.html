
<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng ký - CVAI</title>

    <link rel="stylesheet" href="/css/auth.css">

</head>

<body>


    <!-- HEADER -->

    <header class="header">

        <a href="index.html" class="logo">
            CV<span>AI</span>
        </a>

        <a href="login.html" class="back-home">
            Đã có tài khoản?
            <b>Đăng nhập</b>
        </a>

    </header>


    <!-- MÁY BAY -->

    <div class="paper-plane">

        <div class="plane-body"></div>

        <div class="plane-wing"></div>

    </div>


    <!-- REGISTER -->

    <main class="auth-container register-container">


        <!-- FORM -->

        <section class="auth-box">


            <div class="form-header">

                <p class="small-title">
                    ✦ BẮT ĐẦU NGAY
                </p>

                <h2>
                    Tạo tài khoản
                </h2>

                <p>
                    Bắt đầu tạo CV chuyên nghiệp
                    cùng CVAI
                </p>

            </div>


            <form>


                <!-- HỌ TÊN -->

                <div class="input-group">

                    <label>
                        Họ và tên
                    </label>

                    <input
                        type="text"
                        placeholder="Nhập họ và tên"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Nhập email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label>
                        Mật khẩu
                    </label>

                    <input
                        type="password"
                        placeholder="Tạo mật khẩu"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label>
                        Xác nhận mật khẩu
                    </label>

                    <input
                        type="password"
                        placeholder="Nhập lại mật khẩu"
                        required
                    >

                </div>


                <!-- ĐIỀU KHOẢN -->

                <label class="remember">

                    <input
                        type="checkbox"
                        required
                    >

                    <span>
                        Tôi đồng ý với điều khoản sử dụng
                    </span>

                </label>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                >

                    Tạo tài khoản

                    <span>→</span>

                </button>


            </form>


            <!-- LOGIN -->

            <p class="switch-form">

                Đã có tài khoản?

                <a href="login.html">
                    Đăng nhập
                </a>

            </p>


        </section>


        <!-- BÊN PHẢI -->

        <section class="register-intro">

            <div class="intro-circle">

                <div class="circle-number">
                    01
                </div>

                <h2>
                    Tạo CV
                    <br>
                    <span>theo cách của bạn.</span>
                </h2>

                <p>
                    Điền thông tin.
                    <br>
                    Để AI giúp bạn hoàn thiện.
                </p>

            </div>

        </section>


    </main>


    <footer>

        <p>
            © 2026 CVAI - Tạo CV thông minh với AI
        </p>

    </footer>


</body>

</html>
```
